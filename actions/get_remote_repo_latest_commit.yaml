ref: git.get_remote_repo_latest_commit
label: "Get Remote Repository Latest Commit"
description: "Resolve one branch head in a remote repository"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: git_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
  - standard
parameters:
  repo_remote:
    type: string
    required: true
  branch:
    type: string
    default: master
    required: true
  credential_key:
    type: string
    description: "Optional pack-owned or action-owned encrypted Git credential Key ref"
  timeout_seconds:
    type: integer
    description: "Maximum duration in seconds for each Git command, not the whole action"
    default: 120
    minimum: 1
    maximum: 3600
output:
  branch:
    type: string
    required: true
  revision:
    type: string
    required: true
tags: [git, remote, commit]
