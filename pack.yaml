ref: git
label: "Git"
description: "Safe Git repository actions, Attune Key-backed authentication, and commit monitoring"
version: "0.2.0"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://github.com/attune-packs/git"
  repository_url: "https://github.com/attune-packs/git"
  source_revision: "e291834ae9f5fda45ae5c089f004a7e9fb631594"
  source_version: "2.0.0"
  license: "Apache-2.0"

tags: [git, scm, source-control]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_suite.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
